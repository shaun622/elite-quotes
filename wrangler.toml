name = "elite-quotes"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# ----- D1 database -----
# Create with: wrangler d1 create elite-walls
# Then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "elite-walls"
database_id = "REPLACE_ME_WITH_D1_ID"
migrations_dir = "drizzle"

# ----- R2 bucket (PDFs, snapshots) -----
# Create with: wrangler r2 bucket create elite-walls-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "elite-walls-files"

# ----- KV namespace (sessions + idempotency) -----
# Create with: wrangler kv:namespace create elite-walls-cache
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_ME_WITH_KV_ID"

# Secrets are set via:  wrangler pages secret put <NAME>
# Required: BETTER_AUTH_SECRET, RESEND_API_KEY, RESEND_FROM_EMAIL,
#           BOOTSTRAP_OWNER_EMAIL, PUBLIC_APP_URL, SENTRY_DSN (optional)
